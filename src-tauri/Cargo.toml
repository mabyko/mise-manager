[package]
name = "mise-manager"
version = "0.1.2"
description = "Desktop app for mise plugin version management"
authors = ["Eugene"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mise_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
toml_edit = "0.25"
reqwest = { version = "0.13", features = ["json"] }
tauri-plugin-opener = "2.5.4"
