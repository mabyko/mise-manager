[package]
name = "mise-manager"
version = "0.1.2"
description = "Desktop app for mise plugin version management"
authors = ["Eugene"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mise_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
toml_edit = "0.25"
reqwest = { version = "0.13", features = ["json"] }
tauri-plugin-opener = "2.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBezierPath", "NSColor", "NSStatusBarButton", "NSStatusItem", "NSCell", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAppearance", "NSApplication", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSStatusBar"] }
